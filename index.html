<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fun Value Tours | Konyaaltı Group</title>
</head>
<body style="margin:0;background:#050b13;color:#fff;font-family:Arial,Tahoma">
<div id="loading" style="padding:40px;text-align:center">جاري تحميل الموقع...</div>
<script>
(async()=>{
  const ORIGIN='https://funvaluetours-acbhdt2xg-konyaalti-tours.vercel.app';
  const HAJJ='https://raw.githubusercontent.com/konyaaltigroup-stack/funvaluetours-public/main/assets/button12-hajj-umrah.webp';
  try{
    const res=await fetch(ORIGIN+'/index-original.html?v=public-hajj-1',{cache:'no-store'});
    if(!res.ok) throw new Error('Source HTTP '+res.status);
    let h=await res.text();
    h=h.replace('<head>','<head><base href="'+ORIGIN+'/">');
    const patch=`(()=>{
      const cards=document.querySelectorAll('.rgrid .svc');
      const button12Card=cards.length>=12?cards[11]:null;

      if(cards.length>=4){
        const image4=cards[3].querySelector('.svc-logo');
        if(image4){
          image4.src='${ORIGIN}/assets/button-04-user-image.jpg?v=20260822-2005';
          image4.style.objectFit='cover';
          image4.style.objectPosition='center';
          image4.style.display='block';
        }
      }

      const APARTMENTS_SRC='${ORIGIN}/assets/button5-apartments.webp?v=20260822-2210';
      const HAJJ_UMRAH_SRC='${HAJJ}';

      function normalizedText(card){
        return (card?.textContent||'').replace(/\\s+/g,' ').trim().toLowerCase();
      }
      function isApartments(card){
        const text=normalizedText(card);
        return text.includes('الشقق السياحية')||text.includes('apartments')||text.includes('apartment');
      }
      function isVisasResidence(card){
        const text=normalizedText(card);
        return (text.includes('التأشيرات')&&text.includes('الإقامة'))||(text.includes('visa')&&text.includes('residen'));
      }
      function swapCards(a,b){
        if(!a||!b||a===b||a.parentNode!==b.parentNode)return false;
        const parent=a.parentNode;
        const marker=document.createTextNode('');
        parent.insertBefore(marker,a);
        parent.insertBefore(a,b);
        parent.insertBefore(b,marker);
        marker.remove();
        return true;
      }
      function swapApartmentsAndVisas(){
        const grid=document.querySelector('.rgrid');
        if(!grid||grid.dataset.apartmentsVisasSwapped==='1')return;
        const serviceCards=[...grid.querySelectorAll('.svc')];
        const apartmentsCard=serviceCards.find(isApartments);
        const visasCard=serviceCards.find(isVisasResidence);
        if(!apartmentsCard||!visasCard)return;
        grid.dataset.apartmentsVisasSwapped='1';
        swapCards(apartmentsCard,visasCard);
      }
      function fixApartments(){
        for(const card of document.querySelectorAll('.rgrid .svc')){
          if(!isApartments(card))continue;
          const image=card.querySelector('.svc-logo')||card.querySelector('img');
          if(!image)continue;
          image.removeAttribute('srcset');
          image.src=APARTMENTS_SRC;
          image.style.objectFit='cover';
          image.style.objectPosition='center';
          image.style.display='block';
        }
      }
      function fixHajjUmrah(){
        const card=button12Card;
        if(!card)return;
        const label=card.querySelector('b');
        if(label)label.textContent='الحج والعمرة';
        const image=card.querySelector('.svc-logo')||card.querySelector('img');
        if(image){
          image.removeAttribute('srcset');
          image.src=HAJJ_UMRAH_SRC;
          image.style.objectFit='cover';
          image.style.objectPosition='center';
          image.style.display='block';
        }
      }
      function applyServiceFixes(){
        swapApartmentsAndVisas();
        fixApartments();
        fixHajjUmrah();
      }
      applyServiceFixes();
      setTimeout(applyServiceFixes,100);
      setTimeout(applyServiceFixes,500);
      setTimeout(applyServiceFixes,1500);
      if(document.body){
        new MutationObserver(applyServiceFixes).observe(document.body,{subtree:true,childList:true,characterData:true});
      }
    })();`;
    const tag='<scr'+'ipt>'+patch+'<\\/scr'+'ipt>';
    h=h.includes('</body>')?h.replace('</body>',tag+'</body>'):h+tag;
    document.open();
    document.write(h);
    document.close();
  }catch(e){
    document.body.innerHTML='<div style="padding:40px;text-align:center">تعذر تحميل الموقع، أعد تحديث الصفحة.</div>';
    console.error(e);
  }
})();
</script>
</body>
</html>
